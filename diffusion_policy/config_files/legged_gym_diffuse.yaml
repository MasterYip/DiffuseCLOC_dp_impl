  record_steps: 1000000
  noisy_state_clean_action:
    enable: true
    std_scale: 1.
  perturbation_bodies:
    enable: false
    force_range: 0.
    torque_range: 0.
  perfect_expert_only: true

dataloader:
  batch_size: 1024 #256 #128
  num_workers: 1
  persistent_workers: true
  pin_memory: true
  shuffle: true

val_dataloader:
  batch_size: 2048
  num_workers: 1
  persistent_workers: false
  pin_memory: true
  shuffle: false

ema:
  _target_: diffusion_policy.backbone.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0

exp_name: null
output_dir: "./outputs/"
dataset_dir: "/home/user/CodeSpace/Diffusion/cmp_diffusion_policy/diffusion_diffuse_cloc/data/legged_gym/" # "/home/haytham/ProtoMotions/"

logging:
  group: null
