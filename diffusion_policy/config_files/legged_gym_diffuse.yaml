    - velocity_1
    - default

# multi_run:
#   run_dir: data/outputs/2023.01.16/20.11.42_train_diffusion_transformer_cyber_lowdim
#   wandb_name_base: 2023.01.16-20.11.42_train_diffusion_transformer_cyber_lowdim

optimizer:
  betas:
    - 0.9
    - 0.95
  learning_rate: 0.0001
  weight_decay: 0.001

policy:
  _target_: diffusion_policy.agent.bc_agent.BCAgent
  actor:
    _target_: diffusion_policy.modules.diffuse_cloc.DiffuseCLoC
    backbone:
      _target_: diffusion_policy.backbone.transformer_codiffuse.Transformer
      x_horizon: 20 # 36
      y_horizon: 20
      x_input_dim: 66 #384 #384 #114 #198 #114 #198 #192 #192 # 198 #204 #192 #201 #192
      y_input_dim: 18
      x_output_dim: 66 #384 #384 #114 #198 #114 #198 #192 # 192 #198 #204 #192 #201 #192
      y_output_dim: 18
      n_emb: 256 # 512 # 256 384 512
      n_head: 4 # 8 # 4 6 8
      n_layer: 2 #4 # 6 # 4 6 10
      causal_attn: true
      x_to_x_attn: full
      x_to_y_attn: no_attn
      y_to_x_attn: causal
      y_to_y_attn: causal

    denoising_steps: 20 # 20
    predict_epsilon: false
    denoised_clip_value: 10.0
    action_weight_schedule: constant-to-8
    clean_past_state: true
    clean_past_action: false

    n_past_steps: 4
    # state_emphasis: random_emph_symm
    # FIXME:
    state_emphasis: same
    state_proj: true

dataset:
  _target_: diffusion_policy.dataset.legged_gym_dataset.LeggedGymDataset
  horizon: null
  n_obs_steps: null
  n_past_steps: 4
  pad_after: 1
  pad_before: 1
  seed: 42
  val_ratio: 0.02
  obs_key: obs
  state_key: obs
  action_key: action
  reward_key: null
  checkpoint_filter: null
  max_train_episodes: null
  symm_aug: false
  zarr_path: elspider_dataset.zarr # Update this to your actual zarr file

training:
  checkpoint_every: 1
  debug: false
  device: cuda:0
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_steps: 10000
  max_train_steps: null
  max_val_steps: null
  num_epochs: 1000
  resume: false
  resume_path: "/home/takaraet/Projects/DiffuseCloC/outputs/June-24-13-56-45-joint_diffuse" # /home/takaraet/Projects/DiffuseCloC/outputs/June-24-13-54-10-joint_diffuse'
  rollout_every: 10
  rollout_steps: 200
  sample_every: 3
  seed: 42
  tqdm_interval_sec: 1.0
  use_ema: true
  val_every: 10

checkpoint:
  save_last_ckpt: true

# CLoCAnalyzer Configuration for Real-time Trajectory Analysis
cloc_analyzer:
  # Enable/disable trajectory analysis during evaluation
  enabled: true                     # Set to false to disable analysis completely
  
  # Environment selection for analysis
  analyze_env_idx: 0                # Which environment to analyze (0-based index)
  analyze_all_envs: false           # Set to true to analyze all environments (slower)
  
  # Visualization settings
  visualization:
    update_interval: 10              # Update plots every N steps
    save_plots: false                # Save episode analysis plots
    show_realtime: true             # Show matplotlib window during eval
    plot_size: [24, 8]            # Figure size [width, height] in inches
    
  # Data collection settings  
  data:
    history_length: 500             # Number of timesteps to keep in memory
    horizon: 36                     # Prediction horizon (matches policy)
    n_obs_steps: 4                  # Observation history length
    
  # Output settings
  output:
    output_dir: "./trajectory_analysis/"  # Directory for saved plots
    save_frequency: "never"       # Save plots: "never", "episode", "periodic"
    save_interval: 50               # Save every N steps (if periodic)
    
  # Dimension selection for visualization
  selected_dims:
    # State dimensions to visualize (legged locomotion specific)
    obs: [12,13,14]         # Base position + orientation
    action: [0,1,2]      # Hip joints (left/right)
    state: [12,13,14]       # Same as obs for consistency
    
  # Diagnostic thresholds
  diagnostics:
    # Action magnitude thresholds
    min_action_magnitude: 0.01      # Warning if actions too small
    max_action_magnitude: 10.0      # Warning if actions too large
    
    # Velocity tracking thresholds  
    max_velocity_error: 1.0         # Warning if vel tracking error > threshold
    
    # Inference performance thresholds
    max_inference_time: 0.1         # Warning if inference > 100ms
    target_fps: 50                  # Target control frequency
    
  # Issue detection settings
  issue_detection:
    enabled: true                   # Enable automatic issue detection
    check_interval: 200             # Check for issues every N steps
    print_recommendations: true     # Print solutions when issues detected
    
    # Specific issue checks
    check_action_magnitude: true    # Detect weak/excessive actions
    check_velocity_tracking: true   # Detect poor command following
    check_inference_speed: true     # Detect slow inference
    check_episode_length: true      # Detect premature termination
    
  # Robot-specific settings for legged locomotion
  robot_config:
    # Command velocity extraction
    cmd_vel_dims: [0, 1, 2]         # [vx, vy, vyaw] command dimensions
    robot_vel_dims: [3, 4, 5]       # Robot velocity dimensions in observation
    
    # Root position tracking (for trajectory visualization)
    root_pos_dims: [0, 1]           # [x, y] position dimensions
    root_vel_dims: [3, 4]           # [vx, vy] velocity dimensions
    
    # Joint groups for analysis
    joint_groups:
      hips: [0, 1, 2, 3, 4, 5]      # Hip joint indices
      knees: [6, 7, 8, 9]           # Knee joint indices  
      ankles: [10, 11, 12, 13]      # Ankle joint indices
      
  # Advanced analysis features
  advanced:
    # Trajectory smoothness analysis
    check_smoothness: true          # Analyze action/state smoothness
    smoothness_window: 10           # Window size for smoothness computation
    
    # Frequency analysis
    fft_analysis: false             # Perform FFT analysis (expensive)
    fft_window: 100                 # Window size for FFT
    
    # Phase analysis for periodic gaits
    gait_analysis: true             # Analyze gait patterns
    gait_frequency_range: [0.5, 3.0]  # Expected gait frequency range [Hz]
